# build → tag → publish, driven by the commit message on main.
#
#   feat: …            → minor bump
#   anything else      → patch bump
#   BREAKING CHANGE/!: → major bump
#
# The bump commit carries [skip ci] so this workflow does not retrigger itself.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: bump version
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: bump
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          IFS=. read -r major minor patch <<< "$ver"
          msg=$(git log -1 --pretty=%B)
          if grep -qE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:' <<< "$msg"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\(.+\))?:' <<< "$msg"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          new="$major.$minor.$patch"
          echo "bumping $ver -> $new"
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$new\"/" Cargo.toml
          cargo metadata --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$new [skip ci]"
          git tag "v$new"
          git push origin "HEAD:${GITHUB_REF_NAME}" --tags
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

  build:
    name: build crate
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - run: cargo package --no-verify
      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: publish release
    needs: [bump, build]
    runs-on: ubuntu-latest
    env:
      # Optional crates.io publishing; the step below is a no-op without the secret.
      CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: gh release create "$TAG" dist/* --generate-notes --title "$TAG"
      - name: Publish to crates.io
        if: ${{ env.CARGO_TOKEN != '' }}
        run: cargo publish --token "$CARGO_TOKEN"
